name: Bootstrap tested dependency refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'codex/refresh-tested-dependencies' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/refresh-tested-dependencies
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Update compatible dependency set
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          Object.assign(pkg.dependencies, {
            react: '19.2.8',
            'react-dom': '19.2.8',
          });
          Object.assign(pkg.devDependencies, {
            '@cloudflare/vite-plugin': '1.52.1',
            '@cloudflare/workers-types': '^5.20260817.1',
            '@next/eslint-plugin-next': '16.3.1',
            '@tailwindcss/postcss': '4.3.3',
            '@types/react': '19.2.18',
            '@types/react-dom': '19.2.4',
            '@vitejs/plugin-react': '6.0.5',
            '@vitejs/plugin-rsc': '0.5.34',
            'react-server-dom-webpack': '19.2.8',
            tailwindcss: '4.3.3',
            'typescript-eslint': '8.67.0',
            vinext: '1.0.0-beta.6',
            vite: '8.2.1',
            wrangler: '4.123.0',
          });
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          cat > .github/dependabot.yml <<'YAML'
          version: 2

          updates:
            - package-ecosystem: npm
              directory: /
              schedule:
                interval: weekly
                day: monday
                time: "06:00"
                timezone: Europe/London
              versioning-strategy: increase-if-necessary
              open-pull-requests-limit: 5
              ignore:
                - dependency-name: "@types/node"
                  update-types:
                    - version-update:semver-major
              groups:
                npm-minor-and-patch:
                  update-types:
                    - minor
                    - patch

            - package-ecosystem: pip
              directory: /backend
              schedule:
                interval: weekly
                day: monday
                time: "06:15"
                timezone: Europe/London
              versioning-strategy: increase-if-necessary
              open-pull-requests-limit: 5
              groups:
                python-minor-and-patch:
                  update-types:
                    - minor
                    - patch

            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
                day: monday
                time: "06:30"
                timezone: Europe/London
              open-pull-requests-limit: 5
              groups:
                actions-minor-and-patch:
                  update-types:
                    - minor
                    - patch
          YAML
          npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested dependency set
        run: |
          rm .github/workflows/bootstrap-tested-dependency-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh tested frontend dependencies"
          git push origin HEAD:codex/refresh-tested-dependencies
