name: Apply engine restart recovery

on:
  push:
    branches:
      - codex/recover-engine-restarts

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recover-engine-restarts
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          helper = dedent(r'''
          export class LocalEngineRequestError extends Error {
            /**
             * @param {string} message
             * @param {number} status
             */
            constructor(message, status) {
              super(message);
              this.name = "LocalEngineRequestError";
              this.status = status;
            }
          }

          /**
           * Run one authenticated local mutation, refreshing a rotated process token once.
           *
           * @template T
           * @param {{
           *   token: string,
           *   refreshToken: () => Promise<string>,
           *   request: (token: string) => Promise<T>,
           * }} options
           * @returns {Promise<T>}
           */
          export async function withRefreshedRequestToken({ token, refreshToken, request }) {
            let activeToken = String(token ?? "").trim();
            if (!activeToken) activeToken = String(await refreshToken()).trim();
            if (!activeToken) throw new Error("The local engine request token is unavailable.");

            try {
              return await request(activeToken);
            } catch (error) {
              const tokenRejected =
                error instanceof LocalEngineRequestError &&
                (error.status === 401 || error.status === 403);
              if (!tokenRejected) throw error;

              const refreshedToken = String(await refreshToken()).trim();
              if (!refreshedToken || refreshedToken === activeToken) throw error;
              return request(refreshedToken);
            }
          }
          ''').lstrip()
          Path("app/local-engine.js").write_text(helper, encoding="utf-8")

          helper_test = dedent(r'''
          import assert from "node:assert/strict";
          import test from "node:test";

          import {
            LocalEngineRequestError,
            withRefreshedRequestToken,
          } from "../app/local-engine.js";

          test("uses the current request token without refreshing", async () => {
            const seen = [];
            const result = await withRefreshedRequestToken({
              token: "current-token",
              refreshToken: async () => {
                assert.fail("A valid token should not be refreshed.");
              },
              request: async (token) => {
                seen.push(token);
                return "ok";
              },
            });

            assert.equal(result, "ok");
            assert.deepEqual(seen, ["current-token"]);
          });

          test("fetches a token before the first mutation when none is cached", async () => {
            const seen = [];
            await withRefreshedRequestToken({
              token: "",
              refreshToken: async () => "fresh-token",
              request: async (token) => {
                seen.push(token);
              },
            });
            assert.deepEqual(seen, ["fresh-token"]);
          });

          test("refreshes and retries once after the engine rotates its token", async () => {
            const seen = [];
            let refreshes = 0;
            const result = await withRefreshedRequestToken({
              token: "old-token",
              refreshToken: async () => {
                refreshes += 1;
                return "new-token";
              },
              request: async (token) => {
                seen.push(token);
                if (token === "old-token") {
                  throw new LocalEngineRequestError("invalid token", 403);
                }
                return "accepted";
              },
            });

            assert.equal(result, "accepted");
            assert.equal(refreshes, 1);
            assert.deepEqual(seen, ["old-token", "new-token"]);
          });

          test("does not loop when health returns the same rejected token", async () => {
            let requests = 0;
            await assert.rejects(
              withRefreshedRequestToken({
                token: "same-token",
                refreshToken: async () => "same-token",
                request: async () => {
                  requests += 1;
                  throw new LocalEngineRequestError("forbidden", 403);
                },
              }),
              /forbidden/,
            );
            assert.equal(requests, 1);
          });

          test("does not refresh non-authentication failures", async () => {
            await assert.rejects(
              withRefreshedRequestToken({
                token: "current-token",
                refreshToken: async () => {
                  assert.fail("A server failure must not rotate credentials.");
                },
                request: async () => {
                  throw new LocalEngineRequestError("queue full", 429);
                },
              }),
              /queue full/,
            );
          });
          ''').lstrip()
          Path("tests/local-engine.test.mjs").write_text(helper_test, encoding="utf-8")

          page_path = Path("app/page.tsx")
          page = page_path.read_text(encoding="utf-8")
          page = replace_once(
              page,
              'import { wordFillAt } from "./lyric-timing.js";',
              'import {\n  LocalEngineRequestError,\n  withRefreshedRequestToken,\n} from "./local-engine.js";\nimport { wordFillAt } from "./lyric-timing.js";',
              "helper import",
          )
          page = replace_once(
              page,
              'const LOCAL_REQUEST_TOKEN_HEADER = "X-Lyricwave-Token";',
              'const LOCAL_REQUEST_TOKEN_HEADER = "X-Lyricwave-Token";\nconst ENGINE_OFFLINE_MESSAGE =\n  "The local engine is offline. Run `npm run setup:engine` once, then start the app with `npm run dev`.";',
              "offline constant",
          )
          api_marker = dedent('''
          function apiMessage(payload: unknown, fallback: string) {
            if (payload && typeof payload === "object" && "detail" in payload) {
              const detail = (payload as { detail?: unknown }).detail;
              if (typeof detail === "string") return detail;
            }
            return fallback;
          }

          class RetryablePollingError extends Error {}
          ''').lstrip()
          api_replacement = dedent('''
          function apiMessage(payload: unknown, fallback: string) {
            if (payload && typeof payload === "object" && "detail" in payload) {
              const detail = (payload as { detail?: unknown }).detail;
              if (typeof detail === "string") return detail;
            }
            return fallback;
          }

          async function readEngineHealth() {
            const response = await fetch(`${LOCAL_API_URL}/api/health`, {
              cache: "no-store",
              signal: AbortSignal.timeout(5_000),
            });
            const payload = (await response.json()) as BackendHealth | { detail?: string };
            if (!response.ok) {
              throw new Error(apiMessage(payload, `Local engine returned ${response.status}.`));
            }
            const health = payload as BackendHealth;
            if (!health.request_token) {
              throw new Error("The local engine did not return a request token.");
            }
            return health;
          }

          async function cancelLocalJob(jobId: string, requestToken: string) {
            const response = await fetch(`${LOCAL_API_URL}/api/jobs/${jobId}`, {
              method: "DELETE",
              keepalive: true,
              headers: { [LOCAL_REQUEST_TOKEN_HEADER]: requestToken },
            });
            if (response.ok) return;

            let payload: unknown = null;
            try {
              payload = await response.json();
            } catch {
              // A plain-text proxy error still carries a useful HTTP status.
            }
            throw new LocalEngineRequestError(
              apiMessage(payload, `The local engine returned ${response.status}.`),
              response.status,
            );
          }

          class RetryablePollingError extends Error {}
          ''').lstrip()
          page = replace_once(page, api_marker, api_replacement, "engine API helpers")
          page = replace_once(
              page,
              '      reject(new Error(apiMessage(payload, `The local engine returned ${request.status}.`)));',
              '      reject(\n        new LocalEngineRequestError(\n          apiMessage(payload, `The local engine returned ${request.status}.`),\n          request.status,\n        ),\n      );',
              "typed upload error",
          )
          old_check = dedent('''
            const checkEngine = useCallback(async () => {
              setEngineState("checking");
              try {
                const response = await fetch(`${LOCAL_API_URL}/api/health`, {
                  cache: "no-store",
                  signal: AbortSignal.timeout(5_000),
                });
                if (!response.ok) throw new Error(`Local engine returned ${response.status}`);
                const health = (await response.json()) as BackendHealth;
                if (!health.request_token) {
                  throw new Error("The local engine did not return a request token.");
                }
                requestTokenRef.current = health.request_token;
                setEngineHealth(health);
                setEngineState(health.ready ? "online" : "offline");
                return health.ready;
              } catch {
                setEngineHealth(null);
                setEngineState("offline");
                return false;
              }
            }, []);
          ''').lstrip()
          new_check = dedent('''
            const checkEngine = useCallback(async () => {
              setEngineState("checking");
              try {
                const health = await readEngineHealth();
                requestTokenRef.current = health.request_token;
                setEngineHealth(health);
                setEngineState(health.ready ? "online" : "offline");
                return health;
              } catch {
                requestTokenRef.current = "";
                setEngineHealth(null);
                setEngineState("offline");
                return null;
              }
            }, []);
          ''').lstrip()
          page = replace_once(page, old_check, new_check, "health refresh")
          old_initial_effect = dedent('''
            useEffect(() => {
              const checkTimer = window.setTimeout(() => void checkEngine(), 0);
              return () => window.clearTimeout(checkTimer);
            }, [checkEngine]);

            const cancelCurrentJob = useCallback(() => {
          ''').lstrip()
          new_initial_effect = dedent('''
            useEffect(() => {
              const checkTimer = window.setTimeout(() => void checkEngine(), 0);
              return () => window.clearTimeout(checkTimer);
            }, [checkEngine]);

            useEffect(() => {
              const refreshWhenVisible = () => {
                if (document.visibilityState === "visible") void checkEngine();
              };
              window.addEventListener("focus", refreshWhenVisible);
              document.addEventListener("visibilitychange", refreshWhenVisible);
              return () => {
                window.removeEventListener("focus", refreshWhenVisible);
                document.removeEventListener("visibilitychange", refreshWhenVisible);
              };
            }, [checkEngine]);

            const cancelCurrentJob = useCallback(() => {
          ''').lstrip()
          page = replace_once(page, old_initial_effect, new_initial_effect, "visibility refresh")
          old_cancel = dedent('''
            const cancelCurrentJob = useCallback(() => {
              uploadRequestRef.current?.abort();
              uploadRequestRef.current = null;
              const jobId = activeJobRef.current;
              activeJobRef.current = null;
              if (jobId) {
                const requestToken = requestTokenRef.current;
                void fetch(`${LOCAL_API_URL}/api/jobs/${jobId}`, {
                  method: "DELETE",
                  keepalive: true,
                  headers: requestToken
                    ? { [LOCAL_REQUEST_TOKEN_HEADER]: requestToken }
                    : undefined,
                }).catch(() => {});
              }
            }, []);
          ''').lstrip()
          new_cancel = dedent('''
            const cancelCurrentJob = useCallback(() => {
              uploadRequestRef.current?.abort();
              uploadRequestRef.current = null;
              const jobId = activeJobRef.current;
              activeJobRef.current = null;
              if (jobId) {
                void withRefreshedRequestToken({
                  token: requestTokenRef.current,
                  refreshToken: async () => {
                    const health = await readEngineHealth();
                    requestTokenRef.current = health.request_token;
                    return health.request_token;
                  },
                  request: (requestToken) => cancelLocalJob(jobId, requestToken),
                }).catch(() => {});
              }
            }, []);
          ''').lstrip()
          page = replace_once(page, old_cancel, new_cancel, "cancellation retry")
          old_process = dedent('''
                  const engineReady = engineState === "online" || (await checkEngine());
                  if (!engineReady) {
                    throw new Error(
                      "The local engine is offline. Run `npm run setup:engine` once, then start the app with `npm run dev`.",
                    );
                  }

                  const requestToken = requestTokenRef.current;
                  if (!requestToken) {
                    throw new Error("The local engine request token is unavailable.");
                  }

                  const created = await uploadToLocalEngine(
                    nextFile,
                    language,
                    quality,
                    requestToken,
                    (uploadProgress) => {
                      if (stillCurrent()) setProgress(Math.max(1, uploadProgress));
                    },
                    (request) => {
                      uploadRequestRef.current = request;
                    },
                  );
          ''').lstrip()
          new_process = dedent('''
                  const currentHealth =
                    engineState === "online" && requestTokenRef.current
                      ? engineHealth
                      : await checkEngine();
                  const engineReady =
                    (engineState === "online" && Boolean(requestTokenRef.current)) ||
                    Boolean(currentHealth?.ready);
                  if (!engineReady) throw new Error(ENGINE_OFFLINE_MESSAGE);

                  const created = await withRefreshedRequestToken({
                    token: requestTokenRef.current,
                    refreshToken: async () => {
                      const health = await checkEngine();
                      if (!health?.ready) throw new Error(ENGINE_OFFLINE_MESSAGE);
                      return health.request_token;
                    },
                    request: (requestToken) =>
                      uploadToLocalEngine(
                        nextFile,
                        language,
                        quality,
                        requestToken,
                        (uploadProgress) => {
                          if (stillCurrent()) setProgress(Math.max(1, uploadProgress));
                        },
                        (request) => {
                          uploadRequestRef.current = request;
                        },
                      ),
                  });
          ''').lstrip()
          page = replace_once(page, old_process, new_process, "upload token recovery")
          page = replace_once(
              page,
              '    [cancelCurrentJob, checkEngine, engineState, language, quality],',
              '    [cancelCurrentJob, checkEngine, engineHealth, engineState, language, quality],',
              "process dependencies",
          )
          page_path.write_text(page, encoding="utf-8")

          package_path = Path("package.json")
          package = package_path.read_text(encoding="utf-8")
          package = replace_once(
              package,
              '"test:frontend": "node --test tests/rendered-html.test.mjs tests/lyric-timing.test.mjs tests/lyric-timeline.test.mjs"',
              '"test:frontend": "node --test tests/rendered-html.test.mjs tests/lyric-timing.test.mjs tests/lyric-timeline.test.mjs tests/local-engine.test.mjs"',
              "frontend test command",
          )
          package_path.write_text(package, encoding="utf-8")

          rendered_path = Path("tests/rendered-html.test.mjs")
          rendered = rendered_path.read_text(encoding="utf-8")
          rendered = replace_once(
              rendered,
              '  const timeline = await readFile(new URL("../app/lyric-timeline.js", import.meta.url), "utf8");',
              '  const timeline = await readFile(new URL("../app/lyric-timeline.js", import.meta.url), "utf8");\n  const localEngine = await readFile(new URL("../app/local-engine.js", import.meta.url), "utf8");',
              "local engine fixture",
          )
          rendered = replace_once(
              rendered,
              '  assert.match(page, /request_token/);',
              '  assert.match(page, /request_token/);\n  assert.match(page, /withRefreshedRequestToken/);\n  assert.match(page, /visibilitychange/);\n  assert.match(localEngine, /refreshedToken === activeToken/);',
              "restart assertions",
          )
          rendered_path.write_text(rendered, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              'health endpoint and supplies it through `X-Lyricwave-Token` for POST and DELETE requests;\ncross-origin pages cannot read the token or submit mutation requests without it.',
              'health endpoint and supplies it through `X-Lyricwave-Token` for POST and DELETE requests;\ncross-origin pages cannot read the token or submit mutation requests without it. If the engine\nrestarts and rotates this token, the interface refreshes health and retries one rejected mutation\nwith the new token rather than entering a retry loop.',
              "restart documentation",
          )
          readme_path.write_text(readme, encoding="utf-8")

          Path(".github/workflows/apply-engine-restart-recovery.yml").unlink()
          PY
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover from local engine restarts"
          git push origin HEAD:codex/recover-engine-restarts
