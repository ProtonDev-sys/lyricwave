name: Apply frontend patch

on:
  push:
    branches: [codex/optimize-frontend-runtime]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/optimize-frontend-runtime
          fetch-depth: 0
      - name: Apply verified frontend patch
        run: |
          cat .codex-patch/part-* > /tmp/frontend.patch
          git apply --check /tmp/frontend.patch
          git apply /tmp/frontend.patch
          test "$(git hash-object app/page.tsx)" = "c5124f2073cfa42a517c07fa385b3bbd976f684b"
          test "$(git hash-object app/globals.css)" = "abb96c045d669f0ea6ae942a73296193ea76ac77"
          git rm -r .codex-patch
          git rm .github/workflows/apply-frontend-patch.yml
          git rm .github/workflows/source-snapshot.yml
          git add app/page.tsx app/globals.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply indexed lyric runtime changes"
          git push origin HEAD:codex/optimize-frontend-runtime
