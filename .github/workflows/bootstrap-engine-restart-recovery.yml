name: Bootstrap engine restart recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/recover-engine-restarts' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/recover-engine-restarts
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply embedded patch
        run: |
          python - <<'BOOTSTRAP'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-engine-restart-recovery.yml')
          content = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          terminator = "\n          PY\n"
          script = content.split(marker, 1)[1].split(terminator, 1)[0]
          exec(compile(dedent(script), str(workflow), 'exec'))
          BOOTSTRAP
          rm -f .github/workflows/bootstrap-engine-restart-recovery.yml
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover from local engine restarts"
          git push origin HEAD:codex/recover-engine-restarts
