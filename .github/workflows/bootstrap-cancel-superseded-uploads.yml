name: Bootstrap superseded upload cancellation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/cancel-superseded-uploads' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cancel-superseded-uploads
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              for width in range(1, 17):
                  prefix = " " * width
                  indented_old = "\n".join(
                      prefix + line if line else line for line in old.split("\n")
                  )
                  if text.count(indented_old) != 1:
                      continue
                  indented_new = "\n".join(
                      prefix + line if line else line for line in new.split("\n")
                  )
                  return text.replace(indented_old, indented_new, 1)
              raise RuntimeError(f"{label}: expected one match, found {count}")

          page_path = Path("app/page.tsx")
          page = page_path.read_text(encoding="utf-8")
          old_cancel = dedent('''
          const cancelCurrentJob = useCallback(() => {
            uploadRequestRef.current?.abort();
            uploadRequestRef.current = null;
            const jobId = activeJobRef.current;
            activeJobRef.current = null;
            if (jobId) {
              void withRefreshedRequestToken({
                token: requestTokenRef.current,
                refreshToken: async () => {
                  const health = await readEngineHealth();
                  requestTokenRef.current = health.request_token;
                  return health.request_token;
                },
                request: (requestToken) => cancelLocalJob(jobId, requestToken),
              }).catch(() => {});
            }
          }, []);
          ''').strip("\n")
          new_cancel = dedent('''
          const cancelJobById = useCallback(async (jobId: string) => {
            await withRefreshedRequestToken({
              token: requestTokenRef.current,
              refreshToken: async () => {
                const health = await readEngineHealth();
                requestTokenRef.current = health.request_token;
                return health.request_token;
              },
              request: (requestToken) => cancelLocalJob(jobId, requestToken),
            });
          }, []);

          const cancelCurrentJob = useCallback(() => {
            uploadRequestRef.current?.abort();
            uploadRequestRef.current = null;
            const jobId = activeJobRef.current;
            activeJobRef.current = null;
            if (jobId) void cancelJobById(jobId).catch(() => {});
          }, [cancelJobById]);
          ''').strip("\n")
          page = replace_once(page, old_cancel, new_cancel, "central cancellation")

          old_upload_handoff = dedent('''
          uploadRequestRef.current = null;
          if (!stillCurrent()) return;
          activeJobRef.current = created.id;
          ''').strip("\n")
          new_upload_handoff = dedent('''
          uploadRequestRef.current = null;
          if (!stillCurrent()) {
            void cancelJobById(created.id).catch(() => {});
            return;
          }
          activeJobRef.current = created.id;
          ''').strip("\n")
          page = replace_once(
              page,
              old_upload_handoff,
              new_upload_handoff,
              "stale upload handoff",
          )
          page = replace_once(
              page,
              "[cancelCurrentJob, checkEngine, engineHealth, engineState, language, quality]",
              "[\n      cancelCurrentJob,\n      cancelJobById,\n      checkEngine,\n      engineHealth,\n      engineState,\n      language,\n      quality,\n    ]",
              "processing dependencies",
          )
          page_path.write_text(page, encoding="utf-8")

          test_path = Path("tests/rendered-html.test.mjs")
          test_source = test_path.read_text(encoding="utf-8")
          test_source = replace_once(
              test_source,
              "  assert.match(page, /withRefreshedRequestToken/);\n  assert.match(page, /visibilitychange/);",
              "  assert.match(page, /withRefreshedRequestToken/);\n  assert.match(page, /const cancelJobById = useCallback/);\n  const staleCancellationIndex = page.indexOf(\"void cancelJobById(created.id)\");\n  const activeRegistrationIndex = page.indexOf(\"activeJobRef.current = created.id\");\n  assert.ok(staleCancellationIndex >= 0);\n  assert.ok(activeRegistrationIndex > staleCancellationIndex);\n  assert.match(page, /visibilitychange/);",
              "frontend race assertions",
          )
          test_path.write_text(test_source, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "not reached the GPU removes its executor future immediately, so stopped tracks cannot\nremain ahead of later work. This prevents multiple browser tabs or clients from building\nan unbounded backlog of large local files.",
              "not reached the GPU removes its executor future immediately, so stopped tracks cannot\nremain ahead of later work. If an upload response arrives after the interface has already\nswitched tracks, that exact superseded job is cancelled instead of becoming hidden queue work.\nThis prevents multiple browser tabs or clients from building an unbounded backlog of large\nlocal files.",
              "queue documentation",
          )
          readme_path.write_text(readme, encoding="utf-8")

          Path(".github/workflows/bootstrap-cancel-superseded-uploads.yml").unlink()
          PY
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cancel superseded upload jobs"
          git push origin HEAD:codex/cancel-superseded-uploads
