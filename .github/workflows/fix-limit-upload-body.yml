name: Finalize pre-multipart upload limit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/limit-upload-body' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/limit-upload-body
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply corrected focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/bootstrap-limit-upload-body.yml')
          content = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          terminator = "\n          PY\n"
          script = dedent(content.split(marker, 1)[1].split(terminator, 1)[0])
          exec(compile(script, str(source), 'exec'))

          test_path = Path('backend/test_local_security.py')
          test_source = test_path.read_text(encoding='utf-8')
          old = 'middleware_names[:3],'
          if test_source.count(old) != 1:
              raise RuntimeError('middleware slice: expected one match')
          test_path.write_text(test_source.replace(old, 'middleware_names[:4],', 1), encoding='utf-8')

          Path('.github/workflows/fix-limit-upload-body.yml').unlink()
          PY
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit upload bodies before multipart parsing"
          git push origin HEAD:codex/limit-upload-body
