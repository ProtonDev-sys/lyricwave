name: Apply pre-parse job admission integration

on:
  push:
    branches: [codex/preparse-job-admission]
    paths:
      - scripts/apply-preparse-admission.py
      - .github/workflows/apply-preparse-admission.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate pre-parse job admission') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/preparse-job-admission
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply-preparse-admission.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Remove temporary patch machinery
        run: rm scripts/apply-preparse-admission.py .github/workflows/apply-preparse-admission.yml
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/test_job_lifecycle.py backend/test_local_security.py tests/rendered-html.test.mjs README.md scripts/apply-preparse-admission.py .github/workflows/apply-preparse-admission.yml
          git commit -m "Integrate pre-parse job admission"
          git push origin HEAD:codex/preparse-job-admission
