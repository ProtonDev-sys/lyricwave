name: Apply queued job cancellation integration

on:
  push:
    branches: [codex/cancel-queued-jobs]
    paths:
      - scripts/apply-queued-cancellation.py
      - .github/workflows/apply-queued-cancellation.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate queued job cancellation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cancel-queued-jobs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply-queued-cancellation.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Remove temporary patch machinery
        run: rm scripts/apply-queued-cancellation.py .github/workflows/apply-queued-cancellation.yml
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/job_state.py backend/job_lifecycle.py backend/job_execution.py backend/test_job_execution.py backend/test_job_lifecycle.py README.md scripts/apply-queued-cancellation.py .github/workflows/apply-queued-cancellation.yml
          git commit -m "Integrate queued job cancellation"
          git push origin HEAD:codex/cancel-queued-jobs
