name: Apply minimalist interface redesign

on:
  push:
    branches: [codex/simplify-interface]
    paths:
      - scripts/apply-interface-redesign.py
      - .github/workflows/apply-interface-redesign.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply minimalist interface redesign') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/simplify-interface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply-interface-redesign.py
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Remove temporary patch machinery
        run: rm scripts/apply-interface-redesign.py .github/workflows/apply-interface-redesign.yml
      - name: Commit integrated redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css tests/rendered-html.test.mjs scripts/apply-interface-redesign.py .github/workflows/apply-interface-redesign.yml
          git commit -m "Apply minimalist interface redesign"
          git push origin HEAD:codex/simplify-interface
