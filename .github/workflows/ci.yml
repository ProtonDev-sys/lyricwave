name: CI

on:
  push:
    branches: [main, codex/model-profiles-clean-ui]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.ref == 'refs/heads/codex/model-profiles-clean-ui' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/model-profiles-clean-ui
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Merge latest main and resolve known overlaps
        run: |
          git fetch origin main
          git merge origin/main --no-commit --no-ff || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          printf 'Conflicts:\n%s\n' "$conflicts"
          unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(README\.md|app/page\.tsx|backend/ctc_alignment\.py|backend/job_state\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected conflicts:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          if [ -n "$conflicts" ]; then
            git checkout --ours -- $conflicts
            git add -- $conflicts
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - run: python scripts/reconcile-model-profiles.py
      - run: git diff --check
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Remove temporary integration files
        run: |
          rm scripts/reconcile-model-profiles.py scripts/apply-model-metadata-fixes.py
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Commit reconciled and tested tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile model profiles with timing export metadata"
          git push origin HEAD:codex/model-profiles-clean-ui

  frontend:
    if: ${{ github.ref != 'refs/heads/codex/model-profiles-clean-ui' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend

  backend:
    if: ${{ github.ref != 'refs/heads/codex/model-profiles-clean-ui' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
