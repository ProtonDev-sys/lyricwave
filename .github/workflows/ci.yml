name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - name: Install preview browser
        if: github.head_ref == 'codex/simplify-interface'
        run: npx -y playwright@1.58.2 install --with-deps chromium
      - name: Capture interface previews
        if: github.head_ref == 'codex/simplify-interface'
        run: |
          npx vinext dev --host 127.0.0.1 --port 3000 > /tmp/lyricwave-site.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/lyricwave-site.log
              exit 1
            fi
            sleep 1
          done
          npx -y playwright@1.58.2 screenshot --viewport-size="1440,900" --wait-for-timeout=2500 http://127.0.0.1:3000 interface-desktop.png
          npx -y playwright@1.58.2 screenshot --viewport-size="390,844" --wait-for-timeout=2500 http://127.0.0.1:3000 interface-mobile.png
      - name: Upload interface previews
        if: github.head_ref == 'codex/simplify-interface'
        uses: actions/upload-artifact@v4
        with:
          name: interface-preview
          path: |
            interface-desktop.png
            interface-mobile.png
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
