name: Bootstrap pre-multipart upload limit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/limit-upload-body' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/limit-upload-body
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          upload_limits = dedent('''
          from __future__ import annotations

          from starlette.responses import JSONResponse
          from starlette.types import ASGIApp, Message, Receive, Scope, Send

          from backend.config import MAX_FILE_SIZE


          MULTIPART_OVERHEAD_ALLOWANCE = 2 * 1024 * 1024
          MAX_JOB_REQUEST_BODY_SIZE = MAX_FILE_SIZE + MULTIPART_OVERHEAD_ALLOWANCE
          UPLOAD_TOO_LARGE_DETAIL = "Audio files are limited to 500 MB."


          class RequestBodyTooLarge(RuntimeError):
              pass


          def _content_length(scope: Scope) -> int | None:
              values = [
                  value
                  for name, value in scope.get("headers", [])
                  if name.lower() == b"content-length"
              ]
              if len(values) != 1:
                  return None
              try:
                  value = int(values[0].decode("ascii"))
              except (UnicodeDecodeError, ValueError):
                  return None
              return value if value >= 0 else None


          def _is_job_upload(scope: Scope) -> bool:
              return bool(
                  scope.get("type") == "http"
                  and str(scope.get("method", "")).upper() == "POST"
                  and str(scope.get("path", "")).rstrip("/") == "/api/jobs"
              )


          class JobUploadSizeLimitMiddleware:
              """Reject oversized upload bodies before multipart parsing can spool them."""

              def __init__(
                  self,
                  app: ASGIApp,
                  max_body_size: int = MAX_JOB_REQUEST_BODY_SIZE,
              ) -> None:
                  if max_body_size < 1:
                      raise ValueError("max_body_size must be positive")
                  self.app = app
                  self.max_body_size = int(max_body_size)

              async def _reject(self, scope: Scope, receive: Receive, send: Send) -> None:
                  response = JSONResponse(
                      status_code=413,
                      content={"detail": UPLOAD_TOO_LARGE_DETAIL},
                  )
                  await response(scope, receive, send)

              async def __call__(
                  self,
                  scope: Scope,
                  receive: Receive,
                  send: Send,
              ) -> None:
                  if not _is_job_upload(scope):
                      await self.app(scope, receive, send)
                      return

                  declared_length = _content_length(scope)
                  if declared_length is not None and declared_length > self.max_body_size:
                      await self._reject(scope, receive, send)
                      return

                  received = 0
                  response_started = False

                  async def limited_receive() -> Message:
                      nonlocal received
                      message = await receive()
                      if message.get("type") == "http.request":
                          received += len(message.get("body", b""))
                          if received > self.max_body_size:
                              raise RequestBodyTooLarge()
                      return message

                  async def tracked_send(message: Message) -> None:
                      nonlocal response_started
                      if message.get("type") == "http.response.start":
                          response_started = True
                      await send(message)

                  try:
                      await self.app(scope, limited_receive, tracked_send)
                  except RequestBodyTooLarge:
                      if response_started:
                          raise
                      await self._reject(scope, receive, send)
          ''').lstrip()
          Path("backend/upload_limits.py").write_text(upload_limits, encoding="utf-8")

          upload_tests = dedent('''
          from __future__ import annotations

          import asyncio
          import json
          import unittest
          from collections.abc import Iterable
          from typing import Any

          from backend.upload_limits import JobUploadSizeLimitMiddleware


          class JobUploadSizeLimitMiddlewareTest(unittest.TestCase):
              @staticmethod
              def _run(
                  *,
                  max_body_size: int = 8,
                  path: str = "/api/jobs",
                  method: str = "POST",
                  headers: Iterable[tuple[bytes, bytes]] = (),
                  chunks: Iterable[bytes] = (),
              ) -> tuple[list[dict[str, Any]], bool, int]:
                  sent: list[dict[str, Any]] = []
                  entered_app = False
                  receive_calls = 0
                  bodies = list(chunks)

                  async def receive() -> dict[str, Any]:
                      nonlocal receive_calls
                      receive_calls += 1
                      if not bodies:
                          return {"type": "http.request", "body": b"", "more_body": False}
                      body = bodies.pop(0)
                      return {
                          "type": "http.request",
                          "body": body,
                          "more_body": bool(bodies),
                      }

                  async def send(message: dict[str, Any]) -> None:
                      sent.append(message)

                  async def downstream(
                      scope: dict[str, Any],
                      inner_receive: Any,
                      inner_send: Any,
                  ) -> None:
                      nonlocal entered_app
                      entered_app = True
                      while True:
                          message = await inner_receive()
                          if not message.get("more_body", False):
                              break
                      await inner_send(
                          {
                              "type": "http.response.start",
                              "status": 204,
                              "headers": [],
                          }
                      )
                      await inner_send({"type": "http.response.body", "body": b""})

                  scope = {
                      "type": "http",
                      "asgi": {"version": "3.0"},
                      "http_version": "1.1",
                      "method": method,
                      "scheme": "http",
                      "path": path,
                      "raw_path": path.encode("ascii"),
                      "query_string": b"",
                      "headers": list(headers),
                      "client": ("127.0.0.1", 50000),
                      "server": ("127.0.0.1", 8008),
                  }
                  middleware = JobUploadSizeLimitMiddleware(
                      downstream,
                      max_body_size=max_body_size,
                  )
                  asyncio.run(middleware(scope, receive, send))
                  return sent, entered_app, receive_calls

              @staticmethod
              def _status(messages: list[dict[str, Any]]) -> int:
                  return int(
                      next(
                          message["status"]
                          for message in messages
                          if message["type"] == "http.response.start"
                      )
                  )

              @staticmethod
              def _json_body(messages: list[dict[str, Any]]) -> dict[str, Any]:
                  body = b"".join(
                      message.get("body", b"")
                      for message in messages
                      if message["type"] == "http.response.body"
                  )
                  return json.loads(body)

              def test_declared_oversize_is_rejected_without_reading_the_body(self) -> None:
                  messages, entered_app, receive_calls = self._run(
                      headers=[(b"content-length", b"9")],
                      chunks=[b"ignored"],
                  )
                  self.assertEqual(self._status(messages), 413)
                  self.assertFalse(entered_app)
                  self.assertEqual(receive_calls, 0)
                  self.assertIn("500 MB", self._json_body(messages)["detail"])

              def test_streaming_body_is_stopped_when_the_actual_bytes_exceed_the_limit(self) -> None:
                  messages, entered_app, receive_calls = self._run(
                      chunks=[b"1234", b"56789"],
                  )
                  self.assertEqual(self._status(messages), 413)
                  self.assertTrue(entered_app)
                  self.assertEqual(receive_calls, 2)

              def test_body_at_the_limit_reaches_the_application(self) -> None:
                  messages, entered_app, _ = self._run(
                      headers=[(b"content-length", b"8")],
                      chunks=[b"1234", b"5678"],
                  )
                  self.assertEqual(self._status(messages), 204)
                  self.assertTrue(entered_app)

              def test_unrelated_routes_are_not_limited(self) -> None:
                  messages, entered_app, _ = self._run(
                      path="/api/health",
                      method="GET",
                      headers=[(b"content-length", b"100")],
                      chunks=[b"x" * 100],
                  )
                  self.assertEqual(self._status(messages), 204)
                  self.assertTrue(entered_app)

              def test_invalid_content_length_falls_back_to_stream_counting(self) -> None:
                  messages, _, _ = self._run(
                      headers=[(b"content-length", b"invalid")],
                      chunks=[b"123456789"],
                  )
                  self.assertEqual(self._status(messages), 413)


          if __name__ == "__main__":
              unittest.main()
          ''').lstrip()
          Path("backend/test_upload_limits.py").write_text(upload_tests, encoding="utf-8")

          server_path = Path("backend/server.py")
          server = server_path.read_text(encoding="utf-8")
          server = replace_once(
              server,
              "from backend.model_runtime import (\n    decode_mono as _decode_mono,\n    load_whisper_pipeline as _load_whisper_pipeline,\n    release_whisper_model as _release_whisper_model,\n)\n",
              "from backend.model_runtime import (\n    decode_mono as _decode_mono,\n    load_whisper_pipeline as _load_whisper_pipeline,\n    release_whisper_model as _release_whisper_model,\n)\nfrom backend.upload_limits import JobUploadSizeLimitMiddleware\n",
              "upload limit import",
          )
          server = replace_once(
              server,
              "app = FastAPI(\n    title=\"lyricwave local engine\",\n    version=\"0.3.0\",\n    lifespan=lifespan,\n)\n\n\n@app.middleware(\"http\")",
              "app = FastAPI(\n    title=\"lyricwave local engine\",\n    version=\"0.3.0\",\n    lifespan=lifespan,\n)\napp.add_middleware(JobUploadSizeLimitMiddleware)\n\n\n@app.middleware(\"http\")",
              "upload limit middleware",
          )
          server_path.write_text(server, encoding="utf-8")

          security_test_path = Path("backend/test_local_security.py")
          security_test = security_test_path.read_text(encoding="utf-8")
          security_test = replace_once(
              security_test,
              '["TrustedHostMiddleware", "CORSMiddleware", "BaseHTTPMiddleware"],',
              '[\n                "TrustedHostMiddleware",\n                "CORSMiddleware",\n                "BaseHTTPMiddleware",\n                "JobUploadSizeLimitMiddleware",\n            ],',
              "middleware ordering assertion",
          )
          security_test_path.write_text(security_test, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "The single-GPU queue is reserved in middleware before FastAPI parses or spools multipart\nupload data.",
              "The raw upload body is bounded before multipart parsing: declared oversized requests are\nrejected without reading them, and streamed or misleading requests are stopped once their actual\nbytes exceed the multipart allowance. The single-GPU queue is also reserved in middleware before\nFastAPI parses or spools multipart upload data.",
              "upload safeguard documentation",
          )
          readme_path.write_text(readme, encoding="utf-8")

          Path(".github/workflows/bootstrap-limit-upload-body.yml").unlink()
          PY
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit upload bodies before multipart parsing"
          git push origin HEAD:codex/limit-upload-body
