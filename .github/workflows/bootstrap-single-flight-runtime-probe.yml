name: Bootstrap single-flight runtime probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/single-flight-runtime-probe' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/single-flight-runtime-probe
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/server.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('def _runtime_info() -> dict[str, Any]:\n')
          end = source.index('\n\ndef _worker_environment()', start)
          replacement = '''def _runtime_info() -> dict[str, Any]:
              global _RUNTIME_CACHE

              # Hold the probe lock through cache population. CUDA discovery imports
              # Torch in a subprocess and can take several seconds on a cold start;
              # concurrent health/upload requests should share that one probe.
              with _RUNTIME_LOCK:
                  if _RUNTIME_CACHE and time.monotonic() - _RUNTIME_CACHE[0] < 60:
                      return dict(_RUNTIME_CACHE[1])

                  info: dict[str, Any] = {
                      "ready": False,
                      "cuda": False,
                      "device": "CPU",
                      "ffmpeg": shutil.which("ffmpeg") is not None,
                      "ffprobe": shutil.which("ffprobe") is not None,
                      "demucs": _package_ready("demucs"),
                      "transformers": _package_ready("transformers"),
                  }
                  probe = (
                      "import json,torch; available=bool(torch.cuda.is_available()); "
                      "print(json.dumps({'torch':torch.__version__,'cuda':available,"
                      "'device':torch.cuda.get_device_name(0) if available else 'CPU'}))"
                  )
                  try:
                      creation_flags = subprocess.CREATE_NO_WINDOW if os.name == "nt" else 0
                      completed = subprocess.run(
                          [sys.executable, "-c", probe],
                          capture_output=True,
                          text=True,
                          check=True,
                          timeout=30,
                          creationflags=creation_flags,
                      )
                      info.update(json.loads(completed.stdout.strip().splitlines()[-1]))
                  except Exception as error:  # pragma: no cover - diagnostic path
                      info["torch_error"] = str(error)
                  info["ready"] = bool(
                      info["cuda"]
                      and info["ffmpeg"]
                      and info["ffprobe"]
                      and info["demucs"]
                      and info["transformers"]
                  )
                  _RUNTIME_CACHE = (time.monotonic(), dict(info))
                  return dict(info)
          '''
          from textwrap import dedent
          source = source[:start] + dedent(replacement) + source[end:]
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/bootstrap-single-flight-runtime-probe.yml').unlink()
          PY
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Share cold-start runtime readiness probes"
          git push origin HEAD:codex/single-flight-runtime-probe
