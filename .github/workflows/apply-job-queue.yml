name: Apply bounded queue integration

on:
  push:
    branches: [codex/bound-job-queue]
    paths:
      - scripts/apply-job-queue.py
      - .github/workflows/apply-job-queue.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate bounded job lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/bound-job-queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply-job-queue.py
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s backend -v
      - name: Remove temporary patch machinery
        run: rm scripts/apply-job-queue.py .github/workflows/apply-job-queue.yml
      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.py backend/job_lifecycle.py backend/test_job_lifecycle.py README.md scripts/apply-job-queue.py .github/workflows/apply-job-queue.yml
          git commit -m "Integrate bounded job lifecycle"
          git push origin HEAD:codex/bound-job-queue
