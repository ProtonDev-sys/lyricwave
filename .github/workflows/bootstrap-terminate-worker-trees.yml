name: Bootstrap worker tree cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/terminate-worker-trees' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/terminate-worker-trees
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          process_control = dedent('''
          from __future__ import annotations

          import os
          import signal
          import subprocess
          from typing import Any


          _CREATE_NO_WINDOW = int(getattr(subprocess, "CREATE_NO_WINDOW", 0x08000000))
          _BELOW_NORMAL_PRIORITY_CLASS = int(
              getattr(subprocess, "BELOW_NORMAL_PRIORITY_CLASS", 0x00004000)
          )


          def worker_process_options(platform_name: str | None = None) -> dict[str, Any]:
              """Return Popen options that isolate every model worker and its descendants."""

              platform = os.name if platform_name is None else platform_name
              if platform == "nt":
                  return {
                      "creationflags": _CREATE_NO_WINDOW | _BELOW_NORMAL_PRIORITY_CLASS,
                  }
              return {"start_new_session": True}


          def _wait(process: subprocess.Popen[str], timeout: float) -> bool:
              try:
                  process.wait(timeout=timeout)
                  return True
              except (OSError, subprocess.TimeoutExpired):
                  return False


          def _terminate_directly(
              process: subprocess.Popen[str],
              terminate_timeout: float,
              kill_timeout: float,
          ) -> None:
              try:
                  process.terminate()
              except OSError:
                  pass
              else:
                  if _wait(process, terminate_timeout):
                      return

              try:
                  process.kill()
              except OSError:
                  return
              _wait(process, kill_timeout)


          def _terminate_windows_tree(
              process: subprocess.Popen[str],
              terminate_timeout: float,
          ) -> bool:
              try:
                  completed = subprocess.run(
                      ["taskkill", "/PID", str(process.pid), "/T", "/F"],
                      capture_output=True,
                      check=False,
                      timeout=max(1.0, terminate_timeout),
                      creationflags=_CREATE_NO_WINDOW,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  return False
              return completed.returncode == 0 and _wait(
                  process,
                  min(3.0, terminate_timeout),
              )


          def _terminate_posix_group(
              process: subprocess.Popen[str],
              terminate_timeout: float,
              kill_timeout: float,
          ) -> bool:
              try:
                  process_group = os.getpgid(process.pid)
              except ProcessLookupError:
                  return True
              except OSError:
                  return False

              # Only signal a group that this process leads. This prevents a
              # compatibility fallback or externally supplied process from
              # terminating lyricwave itself.
              if process_group != process.pid:
                  return False

              try:
                  os.killpg(process_group, signal.SIGTERM)
              except ProcessLookupError:
                  return True
              except OSError:
                  return False
              if _wait(process, terminate_timeout):
                  return True

              try:
                  os.killpg(process_group, signal.SIGKILL)
              except ProcessLookupError:
                  return True
              except OSError:
                  return False
              _wait(process, kill_timeout)
              return True


          def terminate_process_tree(
              process: subprocess.Popen[str],
              *,
              platform_name: str | None = None,
              terminate_timeout: float = 10.0,
              kill_timeout: float = 5.0,
          ) -> None:
              """Terminate a model worker and every child process it started."""

              if process.poll() is not None:
                  return

              platform = os.name if platform_name is None else platform_name
              terminated = (
                  _terminate_windows_tree(process, terminate_timeout)
                  if platform == "nt"
                  else _terminate_posix_group(
                      process,
                      terminate_timeout,
                      kill_timeout,
                  )
              )
              if not terminated and process.poll() is None:
                  _terminate_directly(process, terminate_timeout, kill_timeout)
          ''').lstrip()
          Path("backend/process_control.py").write_text(process_control, encoding="utf-8")

          process_tests = dedent('''
          from __future__ import annotations

          import signal
          import subprocess
          import unittest
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import Mock, call, patch

          from backend import process_control


          class FakeProcess:
              def __init__(
                  self,
                  *,
                  pid: int = 1234,
                  poll_result: int | None = None,
              ) -> None:
                  self.pid = pid
                  self.poll_result = poll_result
                  self.terminate = Mock()
                  self.kill = Mock()
                  self.wait = Mock(return_value=0)

              def poll(self) -> int | None:
                  return self.poll_result


          class ProcessControlTest(unittest.TestCase):
              def test_worker_options_create_a_windows_process_tree(self) -> None:
                  options = process_control.worker_process_options("nt")
                  self.assertEqual(
                      options["creationflags"],
                      process_control._CREATE_NO_WINDOW
                      | process_control._BELOW_NORMAL_PRIORITY_CLASS,
                  )
                  self.assertNotIn("start_new_session", options)

              def test_worker_options_create_a_posix_session(self) -> None:
                  self.assertEqual(
                      process_control.worker_process_options("posix"),
                      {"start_new_session": True},
                  )

              def test_completed_process_is_untouched(self) -> None:
                  process = FakeProcess(poll_result=0)
                  with patch.object(process_control.os, "killpg") as killpg:
                      process_control.terminate_process_tree(
                          process,
                          platform_name="posix",
                      )
                  killpg.assert_not_called()
                  process.terminate.assert_not_called()
                  process.kill.assert_not_called()

              def test_posix_process_group_is_terminated(self) -> None:
                  process = FakeProcess()
                  with (
                      patch.object(
                          process_control.os,
                          "getpgid",
                          return_value=process.pid,
                      ),
                      patch.object(process_control.os, "killpg") as killpg,
                  ):
                      process_control.terminate_process_tree(
                          process,
                          platform_name="posix",
                      )
                  killpg.assert_called_once_with(process.pid, signal.SIGTERM)
                  process.wait.assert_called_once_with(timeout=10.0)
                  process.terminate.assert_not_called()

              def test_posix_timeout_escalates_to_the_process_group(self) -> None:
                  process = FakeProcess()
                  process.wait.side_effect = [
                      subprocess.TimeoutExpired("worker", 0.01),
                      0,
                  ]
                  with (
                      patch.object(
                          process_control.os,
                          "getpgid",
                          return_value=process.pid,
                      ),
                      patch.object(process_control.os, "killpg") as killpg,
                  ):
                      process_control.terminate_process_tree(
                          process,
                          platform_name="posix",
                          terminate_timeout=0.01,
                          kill_timeout=0.02,
                      )
                  self.assertEqual(
                      killpg.call_args_list,
                      [
                          call(process.pid, signal.SIGTERM),
                          call(process.pid, signal.SIGKILL),
                      ],
                  )
                  self.assertEqual(
                      process.wait.call_args_list,
                      [call(timeout=0.01), call(timeout=0.02)],
                  )

              def test_non_leader_process_uses_safe_direct_fallback(self) -> None:
                  process = FakeProcess()
                  with (
                      patch.object(
                          process_control.os,
                          "getpgid",
                          return_value=999,
                      ),
                      patch.object(process_control.os, "killpg") as killpg,
                  ):
                      process_control.terminate_process_tree(
                          process,
                          platform_name="posix",
                      )
                  killpg.assert_not_called()
                  process.terminate.assert_called_once_with()
                  process.wait.assert_called_once_with(timeout=10.0)

              def test_windows_uses_taskkill_for_the_process_tree(self) -> None:
                  process = FakeProcess()
                  with patch.object(
                      process_control.subprocess,
                      "run",
                      return_value=SimpleNamespace(returncode=0),
                  ) as run:
                      process_control.terminate_process_tree(
                          process,
                          platform_name="nt",
                      )
                  run.assert_called_once_with(
                      ["taskkill", "/PID", str(process.pid), "/T", "/F"],
                      capture_output=True,
                      check=False,
                      timeout=10.0,
                      creationflags=process_control._CREATE_NO_WINDOW,
                  )
                  process.wait.assert_called_once_with(timeout=3.0)
                  process.terminate.assert_not_called()

              def test_failed_windows_tree_kill_falls_back_and_escalates(self) -> None:
                  process = FakeProcess()
                  process.wait.side_effect = [
                      subprocess.TimeoutExpired("worker", 0.01),
                      0,
                  ]
                  with patch.object(
                      process_control.subprocess,
                      "run",
                      return_value=SimpleNamespace(returncode=1),
                  ):
                      process_control.terminate_process_tree(
                          process,
                          platform_name="nt",
                          terminate_timeout=0.01,
                          kill_timeout=0.02,
                      )
                  process.terminate.assert_called_once_with()
                  process.kill.assert_called_once_with()
                  self.assertEqual(
                      process.wait.call_args_list,
                      [call(timeout=0.01), call(timeout=0.02)],
                  )

              def test_server_wires_both_model_workers_to_isolated_trees(self) -> None:
                  server = Path(__file__).with_name("server.py").read_text(
                      encoding="utf-8"
                  )
                  self.assertEqual(server.count("**worker_process_options(),"), 2)
                  self.assertNotIn("def _worker_creation_flags", server)
                  self.assertNotIn("def _terminate_process", server)


          if __name__ == "__main__":
              unittest.main()
          ''').lstrip()
          Path("backend/test_process_control.py").write_text(process_tests, encoding="utf-8")

          server_path = Path("backend/server.py")
          server = server_path.read_text(encoding="utf-8")
          server = replace_once(
              server,
              "from backend.model_runtime import (\n    decode_mono as _decode_mono,\n    load_whisper_pipeline as _load_whisper_pipeline,\n    release_whisper_model as _release_whisper_model,\n)\nfrom backend.upload_limits import JobUploadSizeLimitMiddleware\n",
              "from backend.model_runtime import (\n    decode_mono as _decode_mono,\n    load_whisper_pipeline as _load_whisper_pipeline,\n    release_whisper_model as _release_whisper_model,\n)\nfrom backend.process_control import (\n    terminate_process_tree as _terminate_process,\n    worker_process_options,\n)\nfrom backend.upload_limits import JobUploadSizeLimitMiddleware\n",
              "process control import",
          )
          old_helpers = dedent('''
          def _worker_creation_flags() -> int:
              if os.name != "nt":
                  return 0
              return subprocess.CREATE_NO_WINDOW | subprocess.BELOW_NORMAL_PRIORITY_CLASS


          def _terminate_process(process: subprocess.Popen[str]) -> None:
              if process.poll() is not None:
                  return
              if os.name == "nt":
                  try:
                      subprocess.run(
                          ["taskkill", "/PID", str(process.pid), "/T", "/F"],
                          capture_output=True,
                          check=False,
                          timeout=12,
                          creationflags=subprocess.CREATE_NO_WINDOW,
                      )
                      process.wait(timeout=3)
                      return
                  except (OSError, subprocess.TimeoutExpired):
                      pass
              try:
                  process.terminate()
                  process.wait(timeout=10)
              except (OSError, subprocess.TimeoutExpired):
                  try:
                      process.kill()
                      process.wait(timeout=5)
                  except (OSError, subprocess.TimeoutExpired):
                      pass


          ''')
          server = replace_once(
              server,
              old_helpers,
              "",
              "inline process helpers",
          )
          creation_count = server.count("creationflags=_worker_creation_flags(),")
          if creation_count != 2:
              raise RuntimeError(
                  f"worker creation options: expected two matches, found {creation_count}"
              )
          server = server.replace(
              "creationflags=_worker_creation_flags(),",
              "**worker_process_options(),",
          )
          server_path.write_text(server, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "Each transcription runs in a disposable, below-normal-priority GPU worker with a\nconfigurable VRAM cap. When a job finishes or is cancelled, that process exits so the\noperating system reclaims its model RAM and CUDA allocations instead of retaining\nthem in the API server.",
              "Each transcription runs in a disposable, below-normal-priority GPU worker with a\nconfigurable VRAM cap. Model workers start in an isolated Windows process tree or POSIX\nsession, so cancellation terminates their Demucs, FFmpeg, and inference descendants as\nwell as the parent. When a job finishes or is cancelled, the operating system reclaims\nits model RAM and CUDA allocations instead of retaining them in the API server.",
              "worker lifecycle documentation",
          )
          readme = replace_once(
              readme,
              "inference API on `http://127.0.0.1:8008`. The launcher terminates both process trees on\nCtrl+C, including their Windows child processes.",
              "inference API on `http://127.0.0.1:8008`. The launcher and engine terminate their\ncomplete process trees on Ctrl+C or job cancellation on both Windows and POSIX systems.",
              "launcher documentation",
          )
          readme_path.write_text(readme, encoding="utf-8")

          Path(".github/workflows/bootstrap-terminate-worker-trees.yml").unlink()
          PY
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Terminate complete model worker trees"
          git push origin HEAD:codex/terminate-worker-trees
