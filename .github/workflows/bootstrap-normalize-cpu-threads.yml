name: Bootstrap shared CPU thread budget

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'codex/normalize-cpu-thread-budget' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/normalize-cpu-thread-budget
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Apply focused integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          server_path = Path("backend/server.py")
          server = server_path.read_text(encoding="utf-8")
          server = replace_once(
              server,
              "from backend.config import (\n    ALLOWED_EXTENSIONS,\n",
              "from backend.config import (\n    ALLOWED_EXTENSIONS,\n    cpu_thread_count,\n",
              "thread budget import",
          )
          old_environment = '''def _worker_environment() -> dict[str, str]:
    environment = os.environ.copy()
    environment.update(
        {
            "PYTHONUNBUFFERED": "1",
            "TOKENIZERS_PARALLELISM": "false",
            "HF_HUB_DISABLE_SYMLINKS_WARNING": "1",
            "OMP_NUM_THREADS": environment.get("LYRICWAVE_CPU_THREADS", "8"),
            "MKL_NUM_THREADS": environment.get("LYRICWAVE_CPU_THREADS", "8"),
            "NUMEXPR_NUM_THREADS": environment.get("LYRICWAVE_CPU_THREADS", "8"),
        }
    )
    return environment
'''
          new_environment = '''def _worker_environment() -> dict[str, str]:
    environment = os.environ.copy()
    thread_budget = str(cpu_thread_count())
    environment.update(
        {
            "PYTHONUNBUFFERED": "1",
            "TOKENIZERS_PARALLELISM": "false",
            "HF_HUB_DISABLE_SYMLINKS_WARNING": "1",
            "OMP_NUM_THREADS": thread_budget,
            "MKL_NUM_THREADS": thread_budget,
            "NUMEXPR_NUM_THREADS": thread_budget,
        }
    )
    return environment
'''
          server = replace_once(
              server,
              old_environment,
              new_environment,
              "worker environment",
          )
          server_path.write_text(server, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              '$env:LYRICWAVE_VRAM_FRACTION = "0.75"\n',
              '$env:LYRICWAVE_VRAM_FRACTION = "0.75"\n$env:LYRICWAVE_CPU_THREADS = "8"\n',
              "CPU override example",
          )
          readme = replace_once(
              readme,
              "`LYRICWAVE_VRAM_FRACTION` is clamped to the range `0.20`–`0.95`. Queue capacity is\nclamped to 1–16 jobs, retention to 1–720 hours, and cleanup frequency to\n30–21,600 seconds.",
              "`LYRICWAVE_VRAM_FRACTION` is clamped to the range `0.20`–`0.95`.\n`LYRICWAVE_CPU_THREADS` is parsed once for native math libraries and PyTorch, defaults\nto at most eight available logical CPUs, and is clamped to 1–32 without exceeding the\nreported machine capacity. Queue capacity is clamped to 1–16 jobs, retention to 1–720\nhours, and cleanup frequency to 30–21,600 seconds.",
              "CPU override documentation",
          )
          readme_path.write_text(readme, encoding="utf-8")

          Path(".github/workflows/bootstrap-normalize-cpu-threads.yml").unlink()
          PY
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:frontend
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend
      - run: python -m unittest backend -v
      - name: Publish tested branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize local inference CPU thread budgets"
          git push origin HEAD:codex/normalize-cpu-thread-budget
